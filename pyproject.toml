[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legisbr"
version = "0.1.0"
description = "Async web scraper for Brazilian federal and state legislation, with PDF/OCR extraction and structured data output."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Felipe Oliveira" }]
keywords = [
    "brazil",
    "legislation",
    "legal",
    "scraper",
    "async",
    "pdf",
    "ocr",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.13.3",
    "beautifulsoup4>=4.13.4",
    "html-to-markdown>=3.22.0",
    "lxml>=6.0",
    "mammoth>=1.13.0",
    "pdfplumber>=0.11",
    "pillow>=11.0",
    "pydantic>=2.10",
    "pypdf>=7.0",
    "pypdfium2>=5.0",
    "tenacity>=9.1.3",
]

[project.urls]
Homepage = "https://github.com/felipeoes/legisbr"
Repository = "https://github.com/felipeoes/legisbr"
Issues = "https://github.com/felipeoes/legisbr/issues"

[project.scripts]
legisbr = "legisbr.cli:entrypoint"

[project.optional-dependencies]
ocr = [
    "pydantic-ai-slim[openai,anthropic,google,bedrock,mistral,groq,huggingface]>=2.63",
]
proxy = ["aiohttp-socks>=0.11.0"]
parquet = ["pyarrow>=18.0"]
mcp = ["mcp>=1.14"]
all = ["legisbr[ocr,proxy,parquet,mcp]"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.15.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/legisbr"]

[tool.hatch.build.targets.sdist]
exclude = [
    "proxies*.txt",
    "logs/",
    "outputs/",
    ".gemini/",
    ".claude/",
    "docs/",
    ".env*",
    ".playwright/",
    ".vscode/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src", "tests", "tests/core"]
markers = [
    "integration: marks tests as live-network integration tests (deselect with -m 'not integration')",
]
timeout = 300
timeout_method = "thread"

[tool.pyright]
include = ["src/legisbr"]
typeCheckingMode = "basic"
pythonVersion = "3.11"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I002"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
